# docker/compose.yaml
# Usage (from the repository root):
#   cp docker/.env.example docker/.env   # then set APP_KEY
#   docker compose -f docker/compose.yaml up -d --build

name: timescribe

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: timescribe:local
  restart: unless-stopped
  env_file: .env
  volumes:
    - timescribe-data:/data

services:
  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "${TIMESCRIBE_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  timescribe-data: